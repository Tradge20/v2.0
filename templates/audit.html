<!doctype html>
<html>
  <head>
    <title>Inventory Audit Log</title>
    <style>
      .nav-bar {
        margin-bottom: 16px;
      }
      .nav-bar a {
        display: inline-block;
        margin-right: 8px;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        text-decoration: none;
        color: #333;
        background-color: #f5f5f5;
      }
      .nav-bar a:hover {
        background-color: #e0e0e0;
      }
      table {
        border-collapse: collapse;
      }
      td,
      th {
        padding: 6px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div class="nav-bar">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('inventory_form') }}">Inventory</a>
      <a href="{{ url_for('view_audit') }}">Audit Log</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>

    <h2>Inventory Audit Log</h2>

    <table border="1" cellpadding="6">
      <tr>
        <th>Type</th>
        <th>Number</th>
        <th>Change</th>
        <th>Action</th>
        <th>Timestamp</th>
      </tr>

      {% for row in rows %}
      <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
